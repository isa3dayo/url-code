<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>競馬アシスト</title></head><body><p id="message">LINEの認証を確認しています…</p>

<script>

(async()=>{
 const message=document.getElementById('message');const fragment=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',location.pathname+location.search);const state=fragment.get('c_state');

  const c=C_PAGES_CONFIG;if(!c)throw Error('not_configured');const gas=new URL(c.gasEndpoint);

  location.replace(route.origin+'/auth/complete#'+new URLSearchParams({state,id_token:idToken}).toString());
 }catch{message.textContent='認証を確認できませんでした。LINEから開き直してください。';}
